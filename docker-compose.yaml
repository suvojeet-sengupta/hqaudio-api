services:
  app:
    container_name: hqaudio-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    volumes:
      - ./logs:/app/logs:z
    environment:
      - PORT=3000
      - RUST_LOG=info
      - REDIS_URL=redis://hqaudio-redis:6379/0
      - REDIS_POOL_SIZE=64
      - RATE_LIMIT_PER_SEC=100
      - RATE_LIMIT_BURST=300
      - TZ=Asia/Kolkata
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - hqaudio-redis

  hqaudio-redis:
    container_name: hqaudio-redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --lazyfree-lazy-eviction yes --lazyfree-lazy-expire yes --tcp-keepalive 60 --hz 100

volumes:
  redis_data:
